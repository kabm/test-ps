<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a5c"/>
      <stop offset="0.55" stop-color="#2d3f9e"/>
      <stop offset="1" stop-color="#6a3fd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.35" stop-color="#ffd36b"/>
      <stop offset="0.75" stop-color="#ff9a3c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff7a2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9efff"/>
      <stop offset="1" stop-color="#9fb2ff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <!-- aperture blades -->
  <g transform="translate(256 256)">
    <circle r="150" fill="none" stroke="url(#ring)" stroke-width="22"/>
    <g fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3">
      <path id="b" d="M0 -139 L120 -69 L52 -30 Z"/>
      <use href="#b" transform="rotate(60)"/>
      <use href="#b" transform="rotate(120)"/>
      <use href="#b" transform="rotate(180)"/>
      <use href="#b" transform="rotate(240)"/>
      <use href="#b" transform="rotate(300)"/>
    </g>
    <circle r="92" fill="url(#glow)"/>
    <circle r="40" fill="#fffaf0"/>
  </g>
</svg>
